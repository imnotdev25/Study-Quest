# Python side of Study Quest (exercises, notebooks, build scripts). Not a package: only used by `uv sync`,
# which creates ./.venv with these pins. The app finds ./.venv automatically during `pnpm tauri dev`.
[project]
name = "study-quest-python"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "marimo==0.25.1",
  "numpy==2.5.4",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
# Some book-code notebooks use PyTorch: `uv sync --extra torch`
torch = ["torch==2.14.1"]

[tool.uv]
package = false
